[project]
name = "tmux-mcp"
version = "0.1.0"
description = "MCP server for tmux — session management and agent interaction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "libtmux>=0.55",
]

[project.scripts]
tmux-mcp = "tmux_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmux_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
